spring.application.name=gym-service
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

app.cors.allowed-origins=http://localhost:3000,http://localhost:8080

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true

#build-in metrics
management.metrics.enable.jvm=false
management.metrics.enable.tomcat=false
management.metrics.enable.system=false
management.metrics.enable.process=false
management.metrics.enable.hikaricp=false
management.metrics.enable.http=false
management.metrics.enable.executor=false
management.metrics.enable.logback=false
management.metrics.enable.application=false
management.metrics.enable.jdbc=false
management.health.diskspace.enabled=false

#only custom metrics will be visible
management.metrics.enable.custom=true
#not recommended
management.metrics.enable.spring.security=false
management.metrics.enable.disk=false

#custom metrics params
trainer.max-trainees=5

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

trainer.workload.service.url=http://TRAINER-WORKLOAD-SERVICE/workload

resilience4j.circuitbreaker.instances.trainerWorkloadService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkloadService.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkloadService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkloadService.wait-duration-in-open-state=10s

#api key
security.api-key=my-secret-key-123

spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.jms.pub-sub-domain=false
